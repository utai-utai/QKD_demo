experiment:
  output_dir: outputs/runs/stage2/layers-21-22-23-r64-{timestamp}
  seed: 42

data:
  train_data: data/processed/demo/train.jsonl
  validation_data: data/processed/demo/validation.jsonl
  batch_size: 1

model:
  teacher: Qwen/Qwen3.5-0.8B-Base
  target_layers: [21, 22, 23]

compression:
  rank: 64
  z_dim: 16
  kappa: 1.0
  gate_scale: 1.0
  c_init_std: 0.1
  encoded_input_mode: input_dependent
  fixed_encoded_std: 0.1
  pb_initialization: svd  # svd=正式初始化；random 仅用于跳过 SVD 的 smoke test
  train_pb: false

photonic:
  provider: deepquantum
  modes: 16
  layers: 16
  meshes: 1  # 1=单 Clements；2=两个 16-layer Clements 网格串联
  shots: null
  ema_decay: 0.9
  theta_init_std: 0.1
  phi_init_std: 0.1

initialization:
  stage1_checkpoints:
    - outputs/runs/stage1_old/layer-21-r64-{latest}
    - outputs/runs/stage1_old/layer-22-r64-{latest}
    - outputs/runs/stage1_old/layer-23-r64-{latest}

optimization:
  steps: 100
  early_stop_loss: null  # 设为数值时，当前训练 loss <= 此值即提前结束；null 表示关闭
  c_learning_rate: 2.0e-4
  photonic_learning_rate: 1.0e-3
  pb_learning_rate: 5.0e-5
  lr_schedule: cosine
  min_lr_scale: 0.1
  spsa_every: 200
  spsa_perturbation: 0.05
  spsa_learning_rate: 0.01
  temperature: 2.0
  top_k: 64

validation:
  every: 200
