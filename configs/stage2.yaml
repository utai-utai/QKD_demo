experiment:
  output_dir: outputs/runs/stage2/layers-21-22-23-r64-{timestamp}
  seed: 42

data:
  train_data: data/processed/demo/train.jsonl
  validation_data: data/processed/demo/validation.jsonl
  batch_size: 1

model:
  teacher: Qwen/Qwen3.5-0.8B-Base
  target_layers: [21, 22, 23]

compression:
  rank: 64
  z_dim: 16
  kappa: 1.0

photonic:
  provider: mock
  shots: null
  ema_decay: 0.9

initialization:
  stage1_checkpoints:
    - outputs/runs/stage1/layer-21-r64-{latest}
    - outputs/runs/stage1/layer-22-r64-{latest}
    - outputs/runs/stage1/layer-23-r64-{latest}

optimization:
  steps: 100
  early_stop_loss: null  # 设为数值时，当前训练 loss <= 此值即提前结束；null 表示关闭
  adam_learning_rate: 2.0e-4
  spsa_every: 200
  spsa_perturbation: 0.05
  spsa_learning_rate: 0.01
  temperature: 2.0
  top_k: 64

logging:
  log_every: 10
