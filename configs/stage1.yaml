experiment:
  output_dir: outputs/runs/stage1_old/layer-21-r64-{timestamp}
  seed: 42

data:
  train_data: data/processed/demo/train.jsonl
  validation_data: data/processed/demo/validation.jsonl
  batch_size: 1

model:
  teacher: Qwen/Qwen3.5-0.8B-Base
  target_layers: [21]

compression:
  rank: 64
  z_dim: 16
  kappa: 1.0
  gate_scale: 0.5  # g = 1 + gate_scale * tanh(Cz)
  train_factors: false  # true 时解冻低秩 P/B；正式微调建议使用远小于 C 的学习率

photonic:
  provider: deepquantum
  modes: 16
  layers: 16
  shots: null
  ema_decay: 0.9

optimization:
  steps: 5000
  early_stop_loss: null  # 设为数值时，当前训练 loss <= 此值即提前结束；null 表示关闭
  adam_learning_rate: 2.0e-4  # C
  photonic_learning_rate: 1.0e-3  # theta/phi
  factor_learning_rate: 5.0e-5  # P/B；仅 compression.train_factors=true 时生效
  lr_schedule: cosine  # constant 或 cosine；cosine 会随 step 平滑下降
  min_lr_scale: 0.1  # cosine 末尾学习率 = 各参数组初始学习率的该比例
  output_loss_weight: 0.8  # L = 0.8*y + 0.1*(up + down)
  auxiliary_loss_weight: 0.1
  loss_scale: 1.0  # 只缩放反传总目标；Adam 下通常不改变实质训练行为
#  spsa_every: 200
#  spsa_perturbation: 0.05
#  spsa_learning_rate: 0.01

validation:
  every: 200
